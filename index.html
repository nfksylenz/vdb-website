<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>VDB Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;1,800;1,900&family=Barlow:wght@500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
</head><body>
<div class="app" id="app">
  <header class="top">
    <div class="logo"><img alt="VDB Personal Trainer" src="logo.jpg"></div>
    <div class="brand">VDB <span>Training</span></div>
    <button class="link" id="logout" type="button" data-a="logout" hidden>Esci</button>
  </header>
  <main id="view"></main>
</div>
<div id="rest" class="rest" hidden>
  <div class="in">
    <div class="t tnum" id="resttime">1:30</div><div class="lbl" id="restlbl">Recupero</div>
    <button type="button" data-a="rest-add">+15s</button><button type="button" data-a="rest-skip">Salta</button>
  </div>
</div>
<nav class="tabbar" id="tabbar" aria-label="Sezioni" hidden>
  <div class="in" role="tablist">
    <button class="tab" role="tab" data-tab="oggi"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>Oggi</button>
    <button class="tab" role="tab" data-tab="allena"><svg viewBox="0 0 24 24"><path d="M3 9v6M6 6v12M18 6v12M21 9v6M6 12h12"/></svg>Scheda</button>
    <button class="tab" role="tab" data-tab="dieta"><svg viewBox="0 0 24 24"><path d="M12 6c-2-2-6-1-6 3 0 4 3 9 6 9s6-5 6-9c0-4-4-5-6-3zM12 6c0-2 1-3 3-3"/></svg>Dieta</button>
    <button class="tab" role="tab" data-tab="progressi"><svg viewBox="0 0 24 24"><path d="M3 20h18M6 16l4-5 4 3 5-8"/></svg>Progressi</button>
    <button class="tab" role="tab" data-tab="prenota"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Prenota</button>
  </div>
</nav>
<div id="toast" class="toast" role="status" hidden></div>
<script src="config.js"></script>
<script type="module" src="backend-firebase.js"></script>
<script src="app.js"></script>
</body></html>
